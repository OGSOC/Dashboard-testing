services:
  postgres:
    image: postgres:16-alpine
    container_name: stock-dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockdash
      POSTGRES_PASSWORD: stockdash
      POSTGRES_DB: stockdash
    ports:
      - "5432:5432"
    volumes:
      - stockdash_pgdata:/var/lib/postgresql/data

volumes:
  stockdash_pgdata:
